name = "biohuman"
# Custom domain biohuman.swal.network is set at deploy time (not deployed here).
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

# Offline-first: health data stays in the device's IndexedDB (biohuman-v1).
# No bindings, no remote database, no backend. The scaffold's D1/R2/KV/AI
# template bindings (which pointed at SHARED resources of other SWAL apps)
# were removed because no code reads them: grep found zero uses of a
# SESSION/KV/D1/R2 binding in src/, workers/, scripts/ or tests/. A test
# pins this (src/wrangler.test.ts).
