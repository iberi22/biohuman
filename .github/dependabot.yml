# Grouped weekly Dependabot configuration (SWAL wave pi-1, S7).
# One pull request per ecosystem per week instead of one PR per bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Deferred: TypeScript 7 breaks `astro check`/`pnpm build` today.
      # @astrojs/check@0.9.10 peers on `^5.0.0 || ^6.0.0` and
      # svelte2tsx@0.7.61 on `^4.9.4 || ^5.0.0 || ^6.0.0`, so 7.x is
      # rejected before it can type-check. Drop this once both accept 7.x.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      # Group minor and patch updates
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a weekly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR per ecosystem instead of one per bump.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Group minor and patch updates
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a weekly batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
