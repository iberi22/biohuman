name: deploy-biohuman

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "workers/**"
      - "migrations/**"
      - "astro.config.mjs"
      - "wrangler.toml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: deploy-biohuman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fase 1: Preflight — the same gates as ci.yml. This workflow also runs on push
  # to main, so it re-runs them instead of trusting a green PR.
  audit-and-verify:
    name: "🛡️ Preflight Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 11 }
      - uses: actions/setup-node@39370e3970a6d050c480ff24fd8ce4e5527d288c # v4.1.0
        with: { node-version: 24, cache: pnpm }
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm run check
      - run: pnpm run type-check
      - run: pnpm test
      - name: Build (SSR + client)
        run: pnpm run build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  # Fase 3: Deploy SSR Worker (Pages vs Workers: SSR >26MB → wrangler deploy, no pages-action)
  deploy-biohuman:
    name: "🚀 Deploy biohuman Worker"
    needs: audit-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 11 }
      - uses: actions/setup-node@39370e3970a6d050c480ff24fd8ce4e5527d288c # v4.1.0
        with: { node-version: 24, cache: pnpm }
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build SSR
        run: pnpm run build
      # @astrojs/cloudflare emits dist/server/wrangler.json from wrangler.toml
      # (name = "biohuman", compatibility_date 2026-09-04, IMAGES binding). It
      # points at entry.mjs and ../client, so the build output is already the
      # deployable config: no pre-deploy rewriting step is needed.
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@b708d70b0cc82da88dcb458a2d1d36d407ff582d # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          command: deploy --config dist/server/wrangler.json

  # Fase 4: Smoke against the deployed worker (replaces scripts/deploy-smoke.sh,
  # which does not exist in this repository).
  smoke-test:
    name: "🩺 Smoke"
    needs: deploy-biohuman
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://biohuman.iberi22.workers.dev
    steps:
      - name: Smoke — worker serves the app
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK $APP_URL/ -> 200"
              exit 0
            fi
            echo "attempt $attempt: $APP_URL/ -> $code"
            sleep 10
          done
          echo "::error::$APP_URL/ never returned 200"
          exit 1
      - name: Smoke — PWA manifest
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL/manifest.json" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$APP_URL/manifest.json -> $code"
            exit 1
          fi
          echo "OK $APP_URL/manifest.json -> 200"

  # Fase 5: Version Tag
  version-tag:
    name: "🏷️ Tag"
    needs: smoke-test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-deploy-$(date +'%Y%m%d-%H%M%S')-$(echo ${{ github.sha }} | cut -c1-8)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy $TAG" && git push origin "$TAG" && echo "Tag $TAG"
